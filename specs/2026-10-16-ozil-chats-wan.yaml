# Même vidéo que 2026-10-16-ozil-chats.yaml, plans générés sur Kaggle (Wan 2.1 VACE) en
# reprenant les mouvements et le cadrage de la vidéo d'origine du but (refs/ozil-but.mp4).
gabarit: clips_commentes
voix:
  commentateur: {edge: fr-FR-HenriNeural, rate: "+18%", pitch: "+4Hz", espeak: fr}
clips:
  - clips/ozil-chats-wan/plan1.mp4
  - clips/ozil-chats-wan/plan2.mp4
generation:
  plans:
    # « debut » : seconde de la vidéo de référence où commence le plan de 5 s.
    - fichier: clips/ozil-chats-wan/plan1.mp4
      reference: refs/ozil-but.mp4
      debut: 0
      prompt: "Night football match in a packed stadium, TV broadcast shot. Anthropomorphic cats and dogs play football standing upright on two legs. A ginger tabby cat wearing a red football shirt with white sleeves runs toward goal with the ball and softly chips it over a golden retriever goalkeeper in a green kit who rushes out. Realistic fur, cinematic stadium lighting."
    - fichier: clips/ozil-chats-wan/plan2.mp4
      reference: refs/ozil-but.mp4
      debut: 5
      prompt: "Night football match in a packed stadium, TV broadcast shot. Anthropomorphic cats and dogs play football standing upright on two legs. A ginger tabby cat in a red shirt with white sleeves stops the ball in front of an empty goal, two dog defenders in green kits, a bulldog and a German shepherd, slide in and miss, the cat taps the ball into the net and celebrates. Realistic fur, cinematic stadium lighting."
score: {gauche: Chats, droite: Chiens, avant: "2-2", apres: "3-2", minute: "87'"}
commentaire:
  - {texte: "87e minute, deux partout entre les chats et les chiens.", a: 0.2}
  - {texte: "Miaouzil part seul !"}
  - {texte: "Le gardien sort… petit lob !", a: 3.2}
  - {texte: "Mais deux chiens reviennent…", a: 5.0}
  - {texte: "Il attend… il attend…"}
  - {texte: "Il les efface tous les deux !", a: 6.6}
  - {texte: "BUT ! MIAOUZIL !", a: 8.2, but: true}
  - {texte: "Le but de la saison !"}
fin: {texte: "Team chat ou team chien ?", duree: 2.5}
publication:
  titre: "Le but d'Özil… mais c'est un chat"
  description: "Miaouzil contre l'équipe des chiens, 87e minute. Team chat ou team chien ?"
  hashtags: ["#ozil", "#chat", "#chien", "#football", "#ia", "#pourtoi"]
  contenu_ia: true
