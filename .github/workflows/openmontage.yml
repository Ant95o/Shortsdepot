name: OpenMontage (installation et rendu)

# OpenMontage (github.com/OpenMontageInc/OpenMontage, sous-module openmontage/, version figée) :
# système de production vidéo piloté par Claude Code. Il complète notre pipeline (HF + Kaggle + montage
# FFmpeg) sans le remplacer. Ce workflow l'installe sur GitHub Actions, liste les outils disponibles
# (preflight) et fait un rendu de démonstration ; les sorties vont sur la branche openmontage-sorties.
on:
  push:
    paths: [".github/workflows/openmontage.yml", ".gitmodules", "openmontage-projets/**/projet.yaml"]
  workflow_dispatch:
    inputs:
      projet:
        description: "Projet à monter (ex. openmontage-projets/angel/projet.yaml)"
        default: ""
      demo:
        description: "Démo Remotion à rendre (vide = aucune)"
        default: ""

permissions:
  contents: write

concurrency:
  group: openmontage
  cancel-in-progress: false

jobs:
  openmontage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Installation (make setup)
        working-directory: openmontage
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          make setup PYTHON_VERSION=3.12

      - name: Outils disponibles (preflight)
        working-directory: openmontage
        run: |
          mkdir -p /tmp/sortie
          make preflight | tee /tmp/sortie/preflight.txt

      - name: Montage du projet ou rendu de démonstration
        run: |
          projet="${{ inputs.projet }}"
          if [ "${{ github.event_name }}" = push ]; then
            projet=$(git diff --name-only HEAD~1 HEAD -- 'openmontage-projets/*/projet.yaml' | tail -1)
          fi
          if [ -n "$projet" ]; then
            nom=$(basename "$(dirname "$projet")")
            openmontage/.venv/bin/pip install -q pyyaml
            openmontage/.venv/bin/python openmontage-projets/monter.py "$projet" "/tmp/sortie/$nom-openmontage.mp4"
            exit 0
          fi
          demo="${{ inputs.demo }}"; [ -n "$demo" ] || exit 0
          cd openmontage && .venv/bin/python render_demo.py "$demo" && cp projects/demos/renders/*.mp4 /tmp/sortie/

      - name: Sauvegarde sur la branche openmontage-sorties
        if: always()
        run: |
          [ -n "$(ls -A /tmp/sortie 2>/dev/null)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin openmontage-sorties || true
          git checkout -B openmontage-sorties origin/openmontage-sorties 2>/dev/null || git checkout --orphan openmontage-sorties
          git rm -rfq --cached . || true
          rm -rf sortie && mkdir sortie && cp -r /tmp/sortie/* sortie/
          git add sortie && git commit -qm "OpenMontage : installation et rendu" && git push origin openmontage-sorties
