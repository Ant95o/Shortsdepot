name: Images (génération gratuite)

# Génère les images d'une fiche essais/images/*.yaml sans compte ni carte (Pollinations / FLUX).
on:
  workflow_dispatch:
    inputs:
      fiche:
        required: true
      seuls:
        description: "numéros d'images à refaire, ex. 2,5 (vide = toutes)"
        default: ""

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SEULS: ${{ inputs.seuls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q gradio_client pyyaml
      - run: python essais/images/generer.py "${{ inputs.fiche }}"
      - name: Sauvegarde sur la branche essais
        if: always()
        run: |
          [ -n "$(ls -A essais/sortie 2>/dev/null)" ] || exit 0
          cp -r essais/sortie /tmp/sortie
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin essais || true
          git checkout -B essais origin/essais 2>/dev/null || git checkout --orphan essais
          mkdir -p sortie && cp -r /tmp/sortie/* sortie/
          git add sortie && git commit -qm "Images générées" && git push origin essais
