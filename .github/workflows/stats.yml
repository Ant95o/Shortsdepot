name: Stats YouTube (chaque matin)

# Relève les vues, j'aime et commentaires de chaque vidéo de la chaîne AI Story (YouTube Data API, clé gratuite)
# et les range sur la branche stats (historique.csv + classement.md). Secret YOUTUBE_API_KEY,
# variable ou secret YOUTUBE_CHAINE (@pseudo de la chaîne).
on:
  schedule:
    - cron: "15 6 * * *"   # 7 h 15 heure de Paris (hiver)
  workflow_dispatch:
  push:
    paths: [".github/workflows/stats.yml", "outils/youtube_stats.py"]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHAINE: ${{ vars.YOUTUBE_CHAINE || secrets.YOUTUBE_CHAINE }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérification de la clé
        run: |
          if [ -z "$YOUTUBE_API_KEY" ] || [ -z "$YOUTUBE_CHAINE" ]; then
            echo "::warning::Ajoute le secret YOUTUBE_API_KEY et YOUTUBE_CHAINE pour activer les stats."; exit 0
          fi
          echo "PRET=1" >> "$GITHUB_ENV"
      - name: Relevé
        if: env.PRET == '1'
        run: |
          cp outils/youtube_stats.py /tmp/
          git fetch origin stats && git checkout -B stats origin/stats || git checkout --orphan stats
          git rm -rfq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name stats -exec rm -rf {} +
          python /tmp/youtube_stats.py stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats && git commit -qm "Stats du $(date +%F)" && git push origin HEAD:stats || echo "rien de neuf"
